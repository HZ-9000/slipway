[package]
name = "slipway"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
color-eyre = "0.6.5"
crossterm = "0.29.0"
env_logger = "0.11.11"
log = "0.4.35"
nix-bindings = { version = "0.2352.0", default-features = false, features = [
    "store",
    "flake",
] }
ratatui = "0.30.2"

[dev-dependencies]
assert_cmd = "2.0.14"
predicates = "3.1.0"
tempfile = "3.10"
